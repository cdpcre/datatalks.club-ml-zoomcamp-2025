apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-marketing-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-marketing-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
---
# Configuration Notes:
#
# TARGET: bank-marketing-deployment
#   - The deployment to autoscale
#   - Must match the deployment name in deployment.yaml
#
# MIN REPLICAS: 1
#   - Minimum number of pods to maintain
#   - Even with no load, there will be at least 1 pod
#
# MAX REPLICAS: 3
#   - Maximum number of pods allowed
#   - IMPORTANT: This is relevant for Question 8
#   - During load testing, count the actual number of pods created
#
# CPU THRESHOLD: 20%
#   - When average CPU utilization exceeds 20%, scale up
#   - This is a low threshold to trigger scaling easily during testing
#   - Specified in the homework requirements
#
# SCALE UP BEHAVIOR:
#   - stabilizationWindowSeconds: 0 (scale up immediately)
#   - Can add up to 2 pods or 100% more pods every 15 seconds
#   - Uses the maximum of these two policies
#
# SCALE DOWN BEHAVIOR:
#   - stabilizationWindowSeconds: 30 (wait 30s before scaling down)
#   - Can remove up to 50% of pods every 15 seconds
#   - Prevents flapping (rapid scale up/down cycles)
#
# PREREQUISITES:
#   - Metrics server must be installed in the cluster
#   - For kind clusters, install with:
#     kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   - Patch for kind (insecure TLS):
#     kubectl patch deployment metrics-server -n kube-system --type='json' \
#       -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
#
# To test HPA:
#   1. Apply the HPA: kubectl apply -f hpa.yaml
#   2. Check status: kubectl get hpa
#   3. Run load test: python load_test.py --requests 1000 --workers 10
#   4. Monitor: kubectl get hpa -w
#   5. Count max pods: kubectl get pods | grep bank-marketing
#
# For Question 8:
#   The answer is the maximum number of pods you observe during the load test.
#   It should be between 1 and 3 (inclusive).
