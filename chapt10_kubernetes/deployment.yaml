# Deployment for ML Zoomcamp Chapter 10 Kubernetes Homework
# Based on homework requirements from:
# https://github.com/DataTalksClub/machine-learning-zoomcamp/blob/master/cohorts/2025/10-kubernetes/homework.md

apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription
spec:
  selector:
    matchLabels:
      app: subscription
  replicas: 1
  template:
    metadata:
      labels:
        app: subscription
    spec:
      containers:
      - name: subscription
        image: zoomcamp-model:3.13.10-hw10
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        ports:
        - containerPort: 9696
---
# ANSWERS REFERENCE:
#
# Q6: The value for <Port> is: 9696
#     This is the containerPort where Flask app listens
#
# IMAGE: zoomcamp-model:3.13.10-hw10
#   - Build with: docker build -f Dockerfile_full -t zoomcamp-model:3.13.10-hw10 .
#   - Or pull: docker pull svizor/zoomcamp-model:3.13.10-hw10
#   - Load into kind: kind load docker-image zoomcamp-model:3.13.10-hw10
#
# RESOURCES (as specified in homework):
#   - Memory request: 64Mi
#   - Memory limit: 128Mi
#   - CPU request: 100m
#   - CPU limit: 200m
